[package]
name = "midden"
version = "0.8.0"
edition = "2024"
rust-version = "1.95.0"
description = "Resolve, audit, visualize, and clean coding-agent context and state"
license = "AGPL-3.0-only"
repository = "https://github.com/starhaven-io/midden"
homepage = "https://midden.rs"
keywords = ["codex", "claude-code", "agent-memory", "audit", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "/.github/",
    "/rust-toolchain.toml",
    "/scripts/",
]

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
clap_complete = "4"
globset = { version = "0.4.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde", "std"] }
walkdir = "2"
colored = "3"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true
