schema: 1
visibility: "public"
license: "agpl"
params:
  codecov: true
  conclusion:
    workflow: ".github/workflows/ci.yml"
    audit-jobs: ["pinprick"]
    pinprick-jobs: ["pinprick"]
  renovate: true
  dependabot:
    - package-ecosystem: "cargo"
      group: "cargo-dependencies"
      directory: "/"
      allow:
        - dependency-type: "all"
    - package-ecosystem: "github-actions"
      group: "github-actions"
      directory: "/"
  link-check:
    targets: "--config lychee.toml README.md SECURITY.md"
    build-site: false
    authenticated-github: true
    schedule: "0 14 * * 1"
    concurrency-group: "link-check"
  codeql:
    languages: ["actions", "rust"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/rust-toolchain*"
      - "**/rust-project.json"
      - "**/.cargo/**"
      - ".github/workflows/**"
    runner: "ubuntu-24.04"
    timeout-minutes: 30
    build-mode: "none"
  pinprick-audit:
    advanced-security: "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
    fail-on-findings: true
    pull-request: true
  readme:
    badges:
      workflow: "ci.yml"
      extra: []
    license: {}
exceptions: {}
