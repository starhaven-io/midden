name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      links: ${{ steps.matrix.outputs.links }}
      zizmor: ${{ steps.matrix.outputs.zizmor }}
      coverage: ${{ steps.matrix.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select trusted router Ruby
        id: trusted-ruby
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull request base SHA is invalid."
            exit 1
          fi
          if git cat-file -e "${BASE_SHA}:scripts/ci-path-routing.rb"; then
            RUBY_VERSION=$(git show "${BASE_SHA}:.ruby-version")
            if [[ ! "${RUBY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Trusted router Ruby version is invalid."
              exit 1
            fi
            echo "version=${RUBY_VERSION}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up router Ruby
        if: steps.trusted-ruby.outputs.version != ''
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ steps.trusted-ruby.outputs.version }}
          bundler: none
          bundler-cache: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: run lint to warm the cache, and coverage so
          # Codecov has a baseline for PR comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            {
              echo 'matrix=[{"name":"Lint","check":"lint","runner":"ubuntu-24.04"},{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04"}]'
              echo "links=false"
              echo "zizmor=false"
              echo "coverage=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull request base SHA is invalid."
            exit 1
          fi

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, coverage, links, and the rest.
          # Routing is itself a security boundary: never execute the pull
          # request's copy and then trust the outputs it chooses to emit.
          ROUTER="${RUNNER_TEMP}/ci-path-routing.rb"
          if git show "${BASE_SHA}:scripts/ci-path-routing.rb" > "${ROUTER}"; then
            # Rename detection would list only a moved file's destination, so
            # renaming a Rust source out of a routed path would schedule nothing.
            git diff --no-renames --name-only -z "${BASE_SHA}...HEAD" \
              | ruby "${ROUTER}" >> "${GITHUB_OUTPUT}"
          else
            # The first change that introduces the trusted-base router cannot
            # load it from base, so fail closed to the complete matrix.
            {
              echo 'matrix=[{"name":"Lint","check":"lint","runner":"ubuntu-24.04"},{"name":"Test (Linux)","check":"test","runner":"ubuntu-24.04"},{"name":"Test (Linux ARM)","check":"test","runner":"ubuntu-24.04-arm"},{"name":"Test (macOS)","check":"test","runner":"macos-26"},{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04"},{"name":"MSRV","check":"msrv","runner":"ubuntu-24.04"}]'
              echo "links=true"
              echo "zizmor=true"
              echo "coverage=true"
            } >> "${GITHUB_OUTPUT}"
          fi

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@fdcc30149f05d8b339921154e77fc44b2e8d75cc # v2026.10.10.2

  fleet:
    name: Fleet guard
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@fdcc30149f05d8b339921154e77fc44b2e8d75cc # v2026.10.10.2
    with:
      repo-name: ${{ github.event.repository.name }}

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Reject repository Cargo configuration
        run: |
          if [[ -e .cargo/config || -L .cargo/config || -e .cargo/config.toml || -L .cargo/config.toml ]]; then
            echo "::error::repository Cargo configuration is not allowed"
            exit 1
          fi

      - name: Restore cargo build cache
        id: cargo-build-cache
        if: matrix.check == 'lint' || matrix.check == 'test' || matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install typos-cli
        if: matrix.check == 'lint'
        env:
          TYPOS_SHA256: "aca6b5d546307092b8d0a8e0a89dd80f9da51f2f7617c5e45c5607c1684ffbf2"
        run: |
          archive="${RUNNER_TEMP}/typos.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "${archive}" \
            "https://github.com/crate-ci/typos/releases/download/v1.50.3/typos-v1.50.3-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" ./typos
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install cargo-deny
        if: matrix.check == 'lint'
        env:
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" --strip-components=1 --wildcards '*/cargo-deny'
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Clippy
        if: matrix.check == 'lint'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustfmt
        if: matrix.check == 'lint'
        run: cargo fmt -- --check

      - name: Typos
        if: matrix.check == 'lint'
        run: typos

      - name: Set up Ruby
        if: matrix.check == 'lint'
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Script contract tests
        if: matrix.check == 'lint'
        run: bundle exec ruby scripts/test.rb

      - name: Cargo deny
        if: matrix.check == 'lint'
        run: cargo deny check

      - name: Save cargo build cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.cargo-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Test
        if: matrix.check == 'test'
        run: cargo test --locked


      - name: Install MSRV toolchain
        if: matrix.check == 'msrv'
        run: |
          # The declared rust-version is only a promise if something builds
          # with it — the other legs use the current toolchain pinned by the repo.
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "${MSRV}" --profile minimal
          echo "MSRV=${MSRV}" >> "${GITHUB_ENV}"

      - name: Check with MSRV toolchain
        if: matrix.check == 'msrv'
        run: cargo "+${MSRV}" check --locked --all-targets


      - name: Add llvm-tools
        if: matrix.check == 'coverage'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-nextest
        if: matrix.check == 'coverage'
        env:
          CARGO_NEXTEST_SHA256: "b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa"
        run: |
          archive="${RUNNER_TEMP}/cargo-nextest.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "${archive}" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_NEXTEST_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" cargo-nextest
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install cargo-llvm-cov
        if: matrix.check == 'coverage'
        env:
          CARGO_LLVM_COV_SHA256: "3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522"
        run: |
          archive="${RUNNER_TEMP}/cargo-llvm-cov.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "${archive}" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_LLVM_COV_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" cargo-llvm-cov
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run tests with coverage
        if: matrix.check == 'coverage'
        run: cargo llvm-cov nextest --locked --profile ci --lcov --output-path lcov.info

      - name: Normalize report paths
        if: success() && matrix.check == 'coverage'
        run: python3 -I scripts/upload-codecov.py --prepare --coverage lcov.info --junit target/nextest/ci/junit.xml

      - name: Upload coverage reports
        if: matrix.check == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            lcov.info
            target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 1

  codecov:
    name: Codecov
    needs: [generate-matrix, check]
    # Forks still run coverage tests; Codecov OIDC accepts same-repository runs.
    if: needs.generate-matrix.outputs.coverage == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Authenticate report uploads to Codecov with GitHub OIDC.
    steps:
      - name: Check out the trusted uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/upload-codecov.py
          sparse-checkout-cone-mode: false
          path: codecov-uploader

      - name: Download coverage-reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          path: reports

      - name: Upload reports with verified Codecov CLI
        run: >-
          python3 -I codecov-uploader/scripts/upload-codecov.py
          --coverage reports/lcov.info
          --junit reports/target/nextest/ci/junit.xml

  links:
    name: Links
    needs: generate-matrix
    if: needs.generate-matrix.outputs.links == 'true'
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@fdcc30149f05d8b339921154e77fc44b2e8d75cc # v2026.10.10.2
    with:
      args: "--config lychee.toml README.md SECURITY.md"
      build-site: false
      site-directory: ""
      authenticated-github: true

  zizmor:
    name: zizmor
    needs: generate-matrix
    if: needs.generate-matrix.outputs.zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@fdcc30149f05d8b339921154e77fc44b2e8d75cc # v2026.10.10.2

  pinprick:
    name: pinprick audit
    needs: generate-matrix
    if: needs.generate-matrix.outputs.zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for SARIF upload on same-repository changes
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@fdcc30149f05d8b339921154e77fc44b2e8d75cc # v2026.10.10.2
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-findings: true

  conclusion:
    name: conclusion
    needs: [generate-matrix, commits, fleet, check, codecov, links, zizmor, pinprick]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          CODECOV_ELIGIBLE: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          COMMITS_RESULT: ${{ needs.commits.result }}
          GENERATE_RESULT: ${{ needs.generate-matrix.result }}
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
          CHECK_RESULT: ${{ needs.check.result }}
          COVERAGE: ${{ needs.generate-matrix.outputs.coverage }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
          EVENT_NAME: ${{ github.event_name }}
          FLEET_RESULT: ${{ needs.fleet.result }}
          LINKS: ${{ needs.generate-matrix.outputs.links }}
          LINKS_RESULT: ${{ needs.links.result }}
          ZIZMOR: ${{ needs.generate-matrix.outputs.zizmor }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
        run: |
          require_result() {
            local name="$1" result="$2" required="$3"
            case "${required}" in
              true) test "${result}" = success ;;
              false) test "${result}" = skipped ;;
              *) echo "::error::Invalid routing decision for ${name}."; return 1 ;;
            esac || { echo "::error::${name} ended with ${result:-no result}."; return 1; }
          }

          test "${GENERATE_RESULT}" = "success"
          case "${EVENT_NAME}" in
            pull_request) REQUIRE_PR_CHECKS=true ;;
            push) REQUIRE_PR_CHECKS=false ;;
            *) echo "::error::Unexpected CI event."; exit 1 ;;
          esac
          require_result commits "${COMMITS_RESULT}" "${REQUIRE_PR_CHECKS}"
          require_result fleet "${FLEET_RESULT}" "${REQUIRE_PR_CHECKS}"
          if [[ "${MATRIX}" == "[]" ]]; then
            require_result check "${CHECK_RESULT}" false
          elif [[ -n "${MATRIX}" ]]; then
            require_result check "${CHECK_RESULT}" true
          else
            echo "::error::The check matrix could not be determined."
            exit 1
          fi
          case "${COVERAGE}:${CODECOV_ELIGIBLE}" in
            true:true) CODECOV_REQUIRED=true ;;
            true:false | false:true | false:false) CODECOV_REQUIRED=false ;;
            *) echo "::error::Invalid Codecov routing decision."; exit 1 ;;
          esac
          require_result codecov "${CODECOV_RESULT}" "${CODECOV_REQUIRED}"
          require_result links "${LINKS_RESULT}" "${LINKS}"
          require_result zizmor "${ZIZMOR_RESULT}" "${ZIZMOR}"
          require_result pinprick "${PINPRICK_RESULT}" "${ZIZMOR}"
