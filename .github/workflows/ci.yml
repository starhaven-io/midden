name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      links: ${{ steps.matrix.outputs.links }}
      zizmor: ${{ steps.matrix.outputs.zizmor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: run lint to warm the cache, and coverage so
          # Codecov has a baseline for PR comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            {
              echo 'matrix=[{"name":"Lint","check":"lint","runner":"ubuntu-24.04"},{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04","environment":"codecov"}]'
              echo "links=false"
              echo "zizmor=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MATRIX='[]'
          add_check() {
            local entry="$1"
            if [[ "${MATRIX}" == "[]" ]]; then
              MATRIX="[${entry}]"
            else
              MATRIX="${MATRIX%]},${entry}]"
            fi
          }
          LINKS=false
          ZIZMOR=false

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, coverage, links, and the rest.
          CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD")

          # Rust or build workflow changes: lint + test on all platforms
          if echo "${CHANGED}" | grep -qE '\.rs$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^clippy\.toml$|^rustfmt\.toml$|^\.github/workflows/(ci|cargo-deny|release)\.yml$'; then
            add_check '{"name":"Lint","check":"lint","runner":"ubuntu-24.04"}'
            add_check '{"name":"Test (Linux)","check":"test","runner":"ubuntu-24.04"}'
            add_check '{"name":"Test (Linux ARM)","check":"test","runner":"ubuntu-24.04-arm"}'
            add_check '{"name":"Test (macOS)","check":"test","runner":"macos-26"}'
            add_check '{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04","environment":"codecov"}'
            add_check '{"name":"MSRV","check":"msrv","runner":"ubuntu-24.04"}'
          elif echo "${CHANGED}" | grep -qE '^deny\.toml$|^_typos\.toml$|^justfile$'; then
            add_check '{"name":"Lint","check":"lint","runner":"ubuntu-24.04"}'
          fi

          # README or link-check config changes: verify links on the PR.
          if echo "${CHANGED}" | grep -qE '^README\.md$|^lychee\.toml$|^\.github/workflows/(ci|link-check)\.yml$'; then
            LINKS=true
          fi

          # Workflow changes: Actions security audit
          if echo "${CHANGED}" | grep -qE '^\.github/workflows/'; then
            ZIZMOR=true
          fi

          {
            echo "matrix=${MATRIX}"
            echo "links=${LINKS}"
            echo "zizmor=${ZIZMOR}"
          } >> "${GITHUB_OUTPUT}"

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@9b96b1a5b91cffa111955fdd1ffefe3cb77bf739 # v2026.08.23.1

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false


      - name: Restore cargo build cache
        id: cargo-build-cache
        if: matrix.check == 'lint' || matrix.check == 'test' || matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Restore coverage tools cache
        id: cov-tools-cache
        if: matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-

      - name: Restore lint tools cache
        id: lint-tools-cache
        if: matrix.check == 'lint'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-

      - name: Install typos-cli
        if: matrix.check == 'lint'
        run: cargo install typos-cli --locked --version 1.49.0

      - name: Install cargo-deny
        if: matrix.check == 'lint'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Clippy
        if: matrix.check == 'lint'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustfmt
        if: matrix.check == 'lint'
        run: cargo fmt -- --check

      - name: Typos
        if: matrix.check == 'lint'
        run: typos

      - name: Cargo deny
        if: matrix.check == 'lint'
        run: cargo deny check

      - name: Save cargo build cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.cargo-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save lint tools cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.lint-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}


      - name: Test
        if: matrix.check == 'test'
        run: cargo test --locked


      - name: Install MSRV toolchain
        if: matrix.check == 'msrv'
        run: |
          # The declared rust-version is only a promise if something builds
          # with it — the other legs use the current toolchain pinned by the repo.
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "${MSRV}" --profile minimal
          echo "MSRV=${MSRV}" >> "${GITHUB_ENV}"

      - name: Check with MSRV toolchain
        if: matrix.check == 'msrv'
        run: cargo "+${MSRV}" check --locked --all-targets


      - name: Add llvm-tools
        if: matrix.check == 'coverage'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-nextest
        if: matrix.check == 'coverage'
        run: cargo install cargo-nextest --locked --version 0.9.143

      - name: Install cargo-llvm-cov
        if: matrix.check == 'coverage'
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      - name: Run tests with coverage
        if: matrix.check == 'coverage'
        run: cargo llvm-cov nextest --locked --profile ci --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.check == 'coverage' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.check == 'coverage' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          fail_ci_if_error: false
          report_type: test_results

      - name: Save coverage tools cache
        if: matrix.check == 'coverage' && github.event_name == 'push' && steps.cov-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}

  links:
    name: Links
    needs: generate-matrix
    if: needs.generate-matrix.outputs.links == 'true'
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@9b96b1a5b91cffa111955fdd1ffefe3cb77bf739 # v2026.08.23.1
    with:
      args: "--config lychee.toml README.md"
      build-site: false
      site-directory: ""
      authenticated-github: true

  zizmor:
    name: zizmor
    needs: generate-matrix
    if: needs.generate-matrix.outputs.zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@9b96b1a5b91cffa111955fdd1ffefe3cb77bf739 # v2026.08.23.1

  conclusion:
    name: conclusion
    needs: [commits, check, links, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          LINKS_RESULT: ${{ needs.links.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          test "${COMMITS_RESULT}" = "success" || test "${COMMITS_RESULT}" = "skipped"
          test "${CHECK_RESULT}" = "success" || test "${CHECK_RESULT}" = "skipped"
          test "${LINKS_RESULT}" = "success" || test "${LINKS_RESULT}" = "skipped"
          test "${ZIZMOR_RESULT}" = "success" || test "${ZIZMOR_RESULT}" = "skipped"
