name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      links: ${{ steps.matrix.outputs.links }}
      zizmor: ${{ steps.matrix.outputs.zizmor }}
      coverage: ${{ steps.matrix.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: run lint to warm the cache, and coverage so
          # Codecov has a baseline for PR comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            {
              echo 'matrix=[{"name":"Lint","check":"lint","runner":"ubuntu-24.04"},{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04"}]'
              echo "links=false"
              echo "zizmor=false"
              echo "coverage=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, coverage, links, and the rest.
          # Routing is itself a security boundary: never execute the pull
          # request's copy and then trust the outputs it chooses to emit.
          ROUTER="${RUNNER_TEMP}/ci-path-routing.py"
          if git show "${BASE_SHA}:scripts/ci-path-routing.py" > "${ROUTER}"; then
            git diff --name-only "${BASE_SHA}...HEAD" \
              | python3 "${ROUTER}" >> "${GITHUB_OUTPUT}"
          else
            # The first change that introduces the trusted-base router cannot
            # load it from base, so fail closed to the complete matrix.
            {
              echo 'matrix=[{"name":"Lint","check":"lint","runner":"ubuntu-24.04"},{"name":"Test (Linux)","check":"test","runner":"ubuntu-24.04"},{"name":"Test (Linux ARM)","check":"test","runner":"ubuntu-24.04-arm"},{"name":"Test (macOS)","check":"test","runner":"macos-26"},{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04"},{"name":"MSRV","check":"msrv","runner":"ubuntu-24.04"}]'
              echo "links=true"
              echo "zizmor=true"
              echo "coverage=true"
            } >> "${GITHUB_OUTPUT}"
          fi

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2

  fleet:
    name: Fleet guard
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2
    with:
      repo-name: ${{ github.event.repository.name }}

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Reject repository Cargo configuration
        run: |
          if [[ -e .cargo/config || -L .cargo/config || -e .cargo/config.toml || -L .cargo/config.toml ]]; then
            echo "::error::repository Cargo configuration is not allowed"
            exit 1
          fi

      - name: Restore cargo build cache
        id: cargo-build-cache
        if: matrix.check == 'lint' || matrix.check == 'test' || matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Restore coverage tools cache
        id: cov-tools-cache
        if: matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-

      - name: Restore lint tools cache
        id: lint-tools-cache
        if: matrix.check == 'lint'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-

      - name: Install typos-cli
        if: matrix.check == 'lint'
        run: cargo install typos-cli --locked --version 1.50.0

      - name: Install cargo-deny
        if: matrix.check == 'lint'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Clippy
        if: matrix.check == 'lint'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustfmt
        if: matrix.check == 'lint'
        run: cargo fmt -- --check

      - name: Typos
        if: matrix.check == 'lint'
        run: typos

      - name: Release note formatter tests
        if: matrix.check == 'lint'
        run: python3 -m unittest discover --start-directory scripts/tests

      - name: Cargo deny
        if: matrix.check == 'lint'
        run: cargo deny check

      - name: Save cargo build cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.cargo-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save lint tools cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.lint-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}


      - name: Test
        if: matrix.check == 'test'
        run: cargo test --locked


      - name: Install MSRV toolchain
        if: matrix.check == 'msrv'
        run: |
          # The declared rust-version is only a promise if something builds
          # with it — the other legs use the current toolchain pinned by the repo.
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "${MSRV}" --profile minimal
          echo "MSRV=${MSRV}" >> "${GITHUB_ENV}"

      - name: Check with MSRV toolchain
        if: matrix.check == 'msrv'
        run: cargo "+${MSRV}" check --locked --all-targets


      - name: Add llvm-tools
        if: matrix.check == 'coverage'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-nextest
        if: matrix.check == 'coverage'
        run: cargo install cargo-nextest --locked --version 0.9.143

      - name: Install cargo-llvm-cov
        if: matrix.check == 'coverage'
        run: cargo install cargo-llvm-cov --locked --version 0.9.0

      - name: Run tests with coverage
        if: matrix.check == 'coverage'
        run: cargo llvm-cov nextest --locked --profile ci --lcov --output-path lcov.info

      - name: Upload coverage reports
        if: matrix.check == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            lcov.info
            target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 1

      - name: Save coverage tools cache
        if: matrix.check == 'coverage' && github.event_name == 'push' && steps.cov-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}

  codecov:
    name: Codecov
    needs: [generate-matrix, check]
    if: needs.generate-matrix.outputs.coverage == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for Codecov OIDC authentication
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          path: coverage-reports

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-reports/lcov.info
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-reports/target/nextest/ci/junit.xml
          fail_ci_if_error: true
          report_type: test_results
          use_oidc: true

  links:
    name: Links
    needs: generate-matrix
    if: needs.generate-matrix.outputs.links == 'true'
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2
    with:
      args: "--config lychee.toml README.md SECURITY.md"
      build-site: false
      site-directory: ""
      authenticated-github: true

  zizmor:
    name: zizmor
    needs: generate-matrix
    if: needs.generate-matrix.outputs.zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2

  pinprick:
    name: pinprick audit
    needs: generate-matrix
    if: needs.generate-matrix.outputs.zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for SARIF upload on same-repository changes
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-findings: true

  conclusion:
    name: conclusion
    needs: [generate-matrix, commits, fleet, check, codecov, links, zizmor, pinprick]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          GENERATE_RESULT: ${{ needs.generate-matrix.result }}
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
          CHECK_RESULT: ${{ needs.check.result }}
          COVERAGE: ${{ needs.generate-matrix.outputs.coverage }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
          EVENT_NAME: ${{ github.event_name }}
          FLEET_RESULT: ${{ needs.fleet.result }}
          LINKS: ${{ needs.generate-matrix.outputs.links }}
          LINKS_RESULT: ${{ needs.links.result }}
          ZIZMOR: ${{ needs.generate-matrix.outputs.zizmor }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
        run: |
          test "${GENERATE_RESULT}" = "success"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test "${COMMITS_RESULT}" = "success"
          else
            test "${COMMITS_RESULT}" = "skipped"
          fi
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test "${FLEET_RESULT}" = "success"
          else
            test "${FLEET_RESULT}" = "skipped"
          fi
          if [[ "${MATRIX}" == "[]" ]]; then
            test "${CHECK_RESULT}" = "skipped"
          else
            test "${CHECK_RESULT}" = "success"
          fi
          if [[ "${COVERAGE}" == "true" ]]; then
            test "${CODECOV_RESULT}" = "success"
          else
            test "${CODECOV_RESULT}" = "skipped"
          fi
          if [[ "${LINKS}" == "true" ]]; then
            test "${LINKS_RESULT}" = "success"
          else
            test "${LINKS_RESULT}" = "skipped"
          fi
          if [[ "${ZIZMOR}" == "true" ]]; then
            test "${ZIZMOR_RESULT}" = "success"
            test "${PINPRICK_RESULT}" = "success"
          else
            test "${ZIZMOR_RESULT}" = "skipped"
            test "${PINPRICK_RESULT}" = "skipped"
          fi
