name: Release

on:
  workflow_dispatch:

defaults:
  run:
    # No -x: release jobs handle credentials and runner-generated secrets.
    shell: bash -euo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject repository Cargo configuration
        run: |
          test ! -e .cargo/config && test ! -L .cargo/config
          test ! -e .cargo/config.toml && test ! -L .cargo/config.toml

      - name: Validate release source
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          test "${REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages | map(select(.name == "midden")) | if length == 1 then .[0].version else error("expected exactly one midden package") end')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Test release note formatter
        run: python3 -B -m unittest discover --start-directory scripts/tests

      - name: Verify crate package
        run: cargo publish --locked --dry-run

  build-linux:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject repository Cargo configuration
        run: |
          test ! -e .cargo/config && test ! -L .cargo/config
          test ! -e .cargo/config.toml && test ! -L .cargo/config.toml

      - name: Set up Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "${TARGET}"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "${TARGET}"

      - name: Validate binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BINARY="target/${TARGET}/release/midden"
          "${BINARY}" --version
          if [[ "${TARGET}" == *-musl ]]; then
            file "${BINARY}"
            if readelf -l "${BINARY}" | grep -q 'Requesting program interpreter'; then
              echo "::error::${TARGET} binary is not statically linked"
              exit 1
            fi
          fi

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ARTIFACT="midden-${VERSION}-${TARGET}"
          mkdir staging
          cp "target/${TARGET}/release/midden" LICENSE staging/
          /usr/bin/tar --no-xattrs -czf "${ARTIFACT}.tar.gz" -C staging .
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: "${{ env.ARTIFACT }}.tar.gz"
          if-no-files-found: error
          retention-days: 7

  attest-linux:
    name: Attest Linux artifacts
    needs: [prepare, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write # publish provenance for the validated Linux archives
      id-token: write # exchange GitHub OIDC for the attestation identity
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midden-*-unknown-linux-*
          path: linux-artifacts
          merge-multiple: true

      - name: Validate attestation subjects
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl; do
            test -f "linux-artifacts/midden-${VERSION}-${target}.tar.gz"
          done
          test "$(find linux-artifacts -type f | wc -l | tr -d ' ')" = "4"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "linux-artifacts/midden-*-unknown-linux-*.tar.gz"

  build-macos:
    name: Build (aarch64-apple-darwin)
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject repository Cargo configuration
        run: |
          test ! -e .cargo/config && test ! -L .cargo/config
          test ! -e .cargo/config.toml && test ! -L .cargo/config.toml

      - name: Build
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Validate unsigned binary
        run: target/aarch64-apple-darwin/release/midden --version

      - name: Stage unsigned payload
        run: |
          mkdir unsigned-macos
          cp target/aarch64-apple-darwin/release/midden LICENSE unsigned-macos/

      - name: Upload unsigned payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos-${{ needs.prepare.outputs.version }}-aarch64-apple-darwin
          path: unsigned-macos/
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    name: Sign and notarize (aarch64-apple-darwin)
    needs: [prepare, build-macos]
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: release
      deployment: false
    permissions:
      attestations: write # publish provenance for the signed archive
      id-token: write # authenticate provenance to GitHub
    env:
      TEMPORARY_KEYCHAIN_FILE: midden-signing.keychain-db
    steps:
      - name: Download unsigned payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos-${{ needs.prepare.outputs.version }}-aarch64-apple-darwin
          path: unsigned-macos

      - name: Validate unsigned payload
        run: |
          test -f unsigned-macos/midden
          test -f unsigned-macos/LICENSE
          test ! -L unsigned-macos/midden
          test ! -L unsigned-macos/LICENSE
          test "$(find unsigned-macos -mindepth 1 | wc -l | tr -d ' ')" = "2"
          chmod +x unsigned-macos/midden
          file unsigned-macos/midden

      - name: Create temporary keychain
        run: |
          TEMPORARY_KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"
          echo "::add-mask::${TEMPORARY_KEYCHAIN_PASSWORD}"
          TEMPORARY_KEYCHAIN_PATH="${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          security create-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${TEMPORARY_KEYCHAIN_PATH}"
          security unlock-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"

      - name: Import signing certificate
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          echo -n "${DEVELOPER_ID_CERTIFICATE}" | base64 --decode --output="${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" \
            -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -t cert -f pkcs12 -A
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security list-keychain -d user -s "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"

      - name: Sign binary
        env:
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          codesign --sign "Developer ID Application: Patrick Linnane (${DEVELOPMENT_TEAM})" \
            --options runtime --timestamp unsigned-macos/midden
          codesign --verify --strict --verbose=2 unsigned-macos/midden

      - name: Notarize binary
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          mkdir "${RUNNER_TEMP}/notarize-staging"
          cp unsigned-macos/midden "${RUNNER_TEMP}/notarize-staging/"
          ditto -c -k "${RUNNER_TEMP}/notarize-staging" "${RUNNER_TEMP}/midden-notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/midden-notarize.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${DEVELOPMENT_TEAM}" \
            --password "${NOTARIZATION_PASSWORD}" \
            --wait \
            --output-format json > "${RUNNER_TEMP}/notary-result.json"
          jq -e '.status == "Accepted"' "${RUNNER_TEMP}/notary-result.json" >/dev/null
          for attempt in 1 2 3 4 5 6; do
            if codesign --verify --strict -R='notarized' --check-notarization \
              --verbose=4 unsigned-macos/midden; then
              break
            fi
            if [[ "${attempt}" == 6 ]]; then
              echo "::error::notarization ticket was not available after bounded retries"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/certificate.p12"
          if [[ -f "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" ]]; then
            security delete-keychain "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          fi

      - name: Package signed binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ARTIFACT="midden-${VERSION}-aarch64-apple-darwin"
          /usr/bin/tar --no-xattrs --no-mac-metadata -czf "${ARTIFACT}.tar.gz" -C unsigned-macos .
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ env.ARTIFACT }}.tar.gz"

      - name: Upload signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: "${{ env.ARTIFACT }}.tar.gz"
          if-no-files-found: error
          retention-days: 7

  generate-notes:
    name: Generate release notes
    needs: prepare
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write # GitHub's generated-notes endpoint requires write access
    steps:
      - name: Generate notes from GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${COMMIT_SHA}" \
            --jq .body > raw-notes.md
          test -s raw-notes.md

      - name: Upload raw notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-release-notes
          path: raw-notes.md
          if-no-files-found: error
          retention-days: 7

  format-notes:
    name: Format release notes
    needs: [prepare, generate-notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download raw notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-release-notes
          path: raw-release-notes

      - name: Format notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 -B -m unittest discover --start-directory scripts/tests
          python3 scripts/format-release-notes.py raw-release-notes/raw-notes.md "${TAG}" > formatted-notes.md
          test -s formatted-notes.md

      - name: Upload formatted notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatted-release-notes
          path: formatted-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [prepare, build-linux, attest-linux, sign-macos, format-notes]
    runs-on: ubuntu-slim
    timeout-minutes: 30
    environment:
      name: release
      deployment: false
    permissions: {}
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midden-*
          path: release-artifacts
          merge-multiple: true

      - name: Download formatted notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formatted-release-notes
          path: formatted-release-notes

      - name: Validate publication inputs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -s formatted-release-notes/formatted-notes.md
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            aarch64-apple-darwin; do
            test -f "release-artifacts/midden-${VERSION}-${target}.tar.gz"
          done
          mapfile -t ARTIFACTS < <(find release-artifacts -type f -name 'midden-*.tar.gz' -print | sort)
          test "${#ARTIFACTS[@]}" = "5"
          test "$(find release-artifacts -type f | wc -l | tr -d ' ')" = "5"
          for artifact in "${ARTIFACTS[@]}"; do
            CONTENTS=$(tar -tzf "${artifact}" | sed 's#^\./##' | grep -v '^$' | sort)
            test "${CONTENTS}" = $'LICENSE\nmidden'
          done

      - name: Mint release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Reconcile tag and release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          api_status() {
            curl --silent --show-error --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$2" --write-out '%{http_code}' "$1"
          }

          STATUS=$(api_status "${API_URL}/repos/${REPOSITORY}/git/ref/tags/${TAG}" tag.json)
          case "${STATUS}" in
            200)
              COMMIT_STATUS=$(api_status "${API_URL}/repos/${REPOSITORY}/commits/${TAG}" tag-commit.json)
              test "${COMMIT_STATUS}" = "200"
              test "$(jq -er .sha tag-commit.json)" = "${COMMIT_SHA}"
              ;;
            404)
              gh api "repos/${REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${TAG}" \
                -f "sha=${COMMIT_SHA}"
              ;;
            *)
              echo "::error::tag lookup returned HTTP ${STATUS}"
              cat tag.json
              exit 1
              ;;
          esac

          RELEASE_STATUS=$(api_status "${API_URL}/repos/${REPOSITORY}/releases/tags/${TAG}" release.json)
          case "${RELEASE_STATUS}" in
            200)
              mkdir published-assets
              declare -A PUBLISHED=()
              while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
                [[ -n "${ASSET_ID}" && -n "${ASSET_NAME}" ]]
                if [[ "${ASSET_NAME}" != "$(basename "${ASSET_NAME}")" ]]; then
                  echo "::error::existing release has unsafe asset name ${ASSET_NAME}"
                  exit 1
                fi
                LOCAL_ASSET="release-artifacts/${ASSET_NAME}"
                if [[ ! -f "${LOCAL_ASSET}" ]]; then
                  echo "::error::existing release has unexpected asset ${ASSET_NAME}"
                  exit 1
                fi
                if [[ -n "${PUBLISHED[${ASSET_NAME}]+present}" ]]; then
                  echo "::error::existing release has duplicate asset ${ASSET_NAME}"
                  exit 1
                fi
                gh api -H "Accept: application/octet-stream" \
                  "repos/${REPOSITORY}/releases/assets/${ASSET_ID}" \
                  > "published-assets/${ASSET_NAME}"
                if ! cmp --silent "${LOCAL_ASSET}" "published-assets/${ASSET_NAME}"; then
                  echo "::error::existing release asset ${ASSET_NAME} differs from this build"
                  exit 1
                fi
                PUBLISHED["${ASSET_NAME}"]=1
              done < <(jq -r '.assets[] | [.id, .name] | @tsv' release.json)

              gh release edit "${TAG}" --repo "${REPOSITORY}" \
                --title "${TAG}" \
                --notes-file formatted-release-notes/formatted-notes.md
              for LOCAL_ASSET in release-artifacts/*.tar.gz; do
                ASSET_NAME=$(basename "${LOCAL_ASSET}")
                if [[ -z "${PUBLISHED[${ASSET_NAME}]+present}" ]]; then
                  gh release upload "${TAG}" --repo "${REPOSITORY}" "${LOCAL_ASSET}"
                fi
              done
              ;;
            404)
              gh release create "${TAG}" --repo "${REPOSITORY}" \
                --title "${TAG}" \
                --notes-file formatted-release-notes/formatted-notes.md \
                release-artifacts/*.tar.gz
              ;;
            *)
              echo "::error::release lookup returned HTTP ${RELEASE_STATUS}"
              cat release.json
              exit 1
              ;;
          esac

  publish-crate:
    name: Publish to crates.io
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      id-token: write # exchange GitHub OIDC for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject repository Cargo configuration
        run: |
          test ! -e .cargo/config && test ! -L .cargo/config
          test ! -e .cargo/config.toml && test ! -L .cargo/config.toml

      - name: Check publication state
        id: crate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          LOCAL_VERSION=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages | map(select(.name == "midden")) | if length == 1 then .[0].version else error("expected exactly one midden package") end')
          test "${LOCAL_VERSION}" = "${VERSION}"
          # cargo publish refuses a dirty working directory, so this lookup
          # must not leave its output beside the crate sources.
          INFO="${RUNNER_TEMP}/crate-info.txt"
          LOOKUP_ERROR="${RUNNER_TEMP}/crate-error.txt"
          if cargo info "midden@${VERSION}" --registry crates-io >"${INFO}" 2>"${LOOKUP_ERROR}"; then
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          elif grep -q "could not find" "${LOOKUP_ERROR}"; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::crates.io lookup failed"
            cat "${LOOKUP_ERROR}"
            exit 1
          fi

      - name: Authenticate to crates.io
        if: steps.crate.outputs.needed == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.crate.outputs.needed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Verification already ran before any credential was minted. Keep the
          # credential-bearing step from compiling package-controlled code.
          cargo publish --locked --no-verify --registry crates-io

  prepare-cask-bump:
    name: Prepare Homebrew cask bump
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.cask.outputs.needed }}
      base_sha: ${{ steps.cask.outputs.base_sha }}
      base_branch: ${{ steps.cask.outputs.base_branch }}
      branch: ${{ steps.cask.outputs.branch }}
      candidate_sha256: ${{ steps.cask.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The publication job either uploaded these exact bytes or failed on a
      # byte mismatch, so the build artifact is the authoritative asset and
      # needs no round trip through the release download endpoint.
      - name: Download published archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midden-*
          path: cask-assets
          merge-multiple: true

      - name: Fetch cask inputs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAP_REPO="starhaven-io/homebrew-tap"
          gh api "repos/${TAP_REPO}" > tap.json
          BASE_BRANCH=$(jq -er .default_branch tap.json)
          gh api "repos/${TAP_REPO}/git/ref/heads/${BASE_BRANCH}" > base-ref.json
          BASE_SHA=$(jq -er .object.sha base-ref.json)
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${TAP_REPO}/contents/Casks/midden.rb?ref=${BASE_SHA}" > base-cask.rb
          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            test -f "cask-assets/midden-${VERSION}-${target}.tar.gz"
          done

      - name: Render and validate exact cask candidate
        id: cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BASE_BRANCH=$(jq -er .default_branch tap.json)
          BASE_SHA=$(jq -er .object.sha base-ref.json)
          MACOS_SHA=$(sha256sum "cask-assets/midden-${VERSION}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          LINUX_ARM_SHA=$(sha256sum "cask-assets/midden-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          LINUX_X86_SHA=$(sha256sum "cask-assets/midden-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          python3 scripts/validate-cask-bump.py --render \
            base-cask.rb candidate-cask.rb "${VERSION}" \
            "${MACOS_SHA}" "${LINUX_ARM_SHA}" "${LINUX_X86_SHA}"
          python3 scripts/validate-cask-bump.py \
            base-cask.rb candidate-cask.rb "${VERSION}" \
            "${MACOS_SHA}" "${LINUX_ARM_SHA}" "${LINUX_X86_SHA}"

          if cmp --silent base-cask.rb candidate-cask.rb; then
            NEEDED=false
          else
            NEEDED=true
          fi
          BRANCH="bump-midden-${VERSION}"
          {
            echo "needed=${NEEDED}"
            echo "base_sha=${BASE_SHA}"
            echo "base_branch=${BASE_BRANCH}"
            echo "branch=${BRANCH}"
            echo "candidate_sha256=$(sha256sum candidate-cask.rb | awk '{print $1}')"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload cask plan
        if: steps.cask.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cask-plan
          path: candidate-cask.rb
          if-no-files-found: error
          retention-days: 1

  write-cask-bump:
    name: Write Homebrew cask bump
    needs: [prepare, prepare-cask-bump]
    if: needs.prepare-cask-bump.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
      deployment: false
    permissions: {}
    outputs:
      pr_number: ${{ steps.write.outputs.pr_number }}
      bot_user: ${{ steps.write.outputs.bot_user }}
      branch: ${{ steps.write.outputs.branch }}
      head_sha: ${{ steps.write.outputs.head_sha }}
    steps:
      - name: Download cask plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cask-plan
          path: cask-plan

      - name: Validate cask plan artifact
        env:
          EXPECTED_SHA256: ${{ needs.prepare-cask-bump.outputs.candidate_sha256 }}
        run: |
          test -n "${EXPECTED_SHA256}"
          test "$(find cask-plan -mindepth 1 -print | wc -l | tr -d ' ')" = 1
          test -f cask-plan/candidate-cask.rb
          test ! -L cask-plan/candidate-cask.rb
          test "$(sha256sum cask-plan/candidate-cask.rb | awk '{print $1}')" = "${EXPECTED_SHA256}"

      - name: Mint bot token for tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Write exact cask candidate with the Git data API
        id: write
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          API_URL: ${{ github.api_url }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BASE_SHA: ${{ needs.prepare-cask-bump.outputs.base_sha }}
          BASE_BRANCH: ${{ needs.prepare-cask-bump.outputs.base_branch }}
          BRANCH: ${{ needs.prepare-cask-bump.outputs.branch }}
        run: |
          TAP_REPO="starhaven-io/homebrew-tap"
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "users/${BOT_USER}" --jq .id)
          [[ "${BOT_ID}" =~ ^[0-9]+$ ]]
          BOT_EMAIL="${BOT_ID}+${BOT_USER}@users.noreply.github.com"
          COMMIT_MESSAGE=$(printf 'midden %s\n\nSigned-off-by: %s <%s>' "${VERSION}" "${BOT_USER}" "${BOT_EMAIL}")
          api_status() {
            curl --silent --show-error --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$2" --write-out '%{http_code}' "$1"
          }
          create_pull_request() {
            gh api --method POST "repos/${TAP_REPO}/pulls" \
              -f "title=midden ${VERSION}" \
              -f "head=starhaven-io:${BRANCH}" \
              -f "base=${BASE_BRANCH}" \
              -f "body=Update midden to ${VERSION}." --jq .number
          }

          CURRENT_BASE=$(gh api "repos/${TAP_REPO}" --jq .default_branch)
          test "${CURRENT_BASE}" = "${BASE_BRANCH}"
          CURRENT_BASE_SHA=$(gh api "repos/${TAP_REPO}/git/ref/heads/${BASE_BRANCH}" --jq .object.sha)
          test "${CURRENT_BASE_SHA}" = "${BASE_SHA}"

          CONTENT=$(base64 -w 0 cask-plan/candidate-cask.rb)
          BLOB_SHA=$(jq -n --arg content "${CONTENT}" \
            '{content: $content, encoding: "base64"}' \
            | gh api --method POST "repos/${TAP_REPO}/git/blobs" --input - --jq .sha)
          BASE_TREE=$(gh api "repos/${TAP_REPO}/git/commits/${BASE_SHA}" --jq .tree.sha)
          TREE_SHA=$(jq -n --arg base "${BASE_TREE}" --arg blob "${BLOB_SHA}" \
            '{base_tree: $base, tree: [{path: "Casks/midden.rb", mode: "100644", type: "blob", sha: $blob}]}' \
            | gh api --method POST "repos/${TAP_REPO}/git/trees" --input - --jq .sha)
          COMMIT_SHA=$(jq -n \
            --arg message "${COMMIT_MESSAGE}" \
            --arg name "${BOT_USER}" --arg email "${BOT_EMAIL}" \
            --arg tree "${TREE_SHA}" \
            --arg parent "${BASE_SHA}" \
            '{message: $message, tree: $tree, parents: [$parent],
              author: {name: $name, email: $email}, committer: {name: $name, email: $email}}' \
            | gh api --method POST "repos/${TAP_REPO}/git/commits" --input - --jq .sha)

          REF_STATUS=$(api_status "${API_URL}/repos/${TAP_REPO}/git/ref/heads/${BRANCH}" branch-ref.json)
          case "${REF_STATUS}" in
            200)
              EXISTING_SHA=$(jq -er .object.sha branch-ref.json)
              gh api "repos/${TAP_REPO}/git/commits/${EXISTING_SHA}" > branch-commit.json
              jq -e \
                --arg tree "${TREE_SHA}" \
                --arg parent "${BASE_SHA}" \
                --arg message "${COMMIT_MESSAGE}" \
                --arg name "${BOT_USER}" --arg email "${BOT_EMAIL}" \
                '.tree.sha == $tree
                  and .message == $message
                  and .author.name == $name and .author.email == $email
                  and .committer.name == $name and .committer.email == $email
                  and (.parents | length) == 1
                  and .parents[0].sha == $parent' branch-commit.json >/dev/null
              COMMIT_SHA="${EXISTING_SHA}"
              gh api --method GET "repos/${TAP_REPO}/pulls" \
                -f state=all -f "head=starhaven-io:${BRANCH}" \
                -F per_page=100 > matching-prs.json
              MATCH_COUNT=$(jq -er length matching-prs.json)
              if [[ "${MATCH_COUNT}" == "0" ]]; then
                PR_NUMBER=$(create_pull_request)
              elif [[ "${MATCH_COUNT}" == "1" ]]; then
                jq -e --arg bot "${BOT_USER}" --arg branch "${BRANCH}" --arg base "${BASE_BRANCH}" \
                  '.[0].state == "open"
                    and .[0].user.login == $bot
                    and .[0].head.ref == $branch
                    and .[0].head.repo.full_name == "starhaven-io/homebrew-tap"
                    and .[0].base.ref == $base' matching-prs.json >/dev/null
                PR_NUMBER=$(jq -er '.[0].number' matching-prs.json)
              else
                echo "::error::multiple pull requests found for tap branch ${BRANCH}"
                exit 1
              fi
              ;;
            404)
              gh api --method POST "repos/${TAP_REPO}/git/refs" \
                -f "ref=refs/heads/${BRANCH}" -f "sha=${COMMIT_SHA}" >/dev/null
              PR_NUMBER=$(create_pull_request)
              ;;
            *)
              echo "::error::tap branch lookup returned HTTP ${REF_STATUS}"
              cat branch-ref.json
              exit 1
              ;;
          esac

          PR_JSON=$(gh api "repos/${TAP_REPO}/pulls/${PR_NUMBER}")
          jq -e \
            --arg bot "${BOT_USER}" \
            --arg branch "${BRANCH}" \
            --arg base "${BASE_BRANCH}" \
            --arg head "${COMMIT_SHA}" \
            '.state == "open"
              and .user.login == $bot
              and .head.ref == $branch
              and .head.repo.full_name == "starhaven-io/homebrew-tap"
              and .head.sha == $head
              and .base.ref == $base' <<< "${PR_JSON}" >/dev/null
          {
            echo "pr_number=${PR_NUMBER}"
            echo "bot_user=${BOT_USER}"
            echo "branch=${BRANCH}"
            echo "head_sha=${COMMIT_SHA}"
          } >> "${GITHUB_OUTPUT}"

  validate-cask-bump:
    name: Validate Homebrew cask bump
    needs: [prepare-cask-bump, write-cask-bump]
    if: needs.prepare-cask-bump.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: Download cask plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cask-plan
          path: cask-plan

      - name: Validate exact remote cask change
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.write-cask-bump.outputs.pr_number }}
          BOT_USER: ${{ needs.write-cask-bump.outputs.bot_user }}
          BRANCH: ${{ needs.write-cask-bump.outputs.branch }}
          EXPECTED_HEAD: ${{ needs.write-cask-bump.outputs.head_sha }}
          BASE_SHA: ${{ needs.prepare-cask-bump.outputs.base_sha }}
          BASE_BRANCH: ${{ needs.prepare-cask-bump.outputs.base_branch }}
          EXPECTED_SHA256: ${{ needs.prepare-cask-bump.outputs.candidate_sha256 }}
        run: |
          PR_JSON=$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}")
          jq -e \
            --arg bot "${BOT_USER}" \
            --arg base "${BASE_BRANCH}" \
            --arg base_sha "${BASE_SHA}" \
            --arg branch "${BRANCH}" \
            --arg head "${EXPECTED_HEAD}" \
            '.state == "open"
              and .user.login == $bot
              and .base.ref == $base
              and .base.sha == $base_sha
              and .head.ref == $branch
              and .head.repo.full_name == "starhaven-io/homebrew-tap"
              and .head.sha == $head
              and .changed_files == 1' <<< "${PR_JSON}" >/dev/null
          test "$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}/files" \
            --jq 'if length == 1 and .[0].filename == "Casks/midden.rb" and .[0].status == "modified" then "valid" else "invalid" end')" = valid
          test "$(find cask-plan -mindepth 1 -print | wc -l | tr -d ' ')" = 1
          test -f cask-plan/candidate-cask.rb
          test ! -L cask-plan/candidate-cask.rb
          test "$(sha256sum cask-plan/candidate-cask.rb | awk '{print $1}')" = "${EXPECTED_SHA256}"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "/repos/starhaven-io/homebrew-tap/contents/Casks/midden.rb?ref=${EXPECTED_HEAD}" \
            > remote-cask.rb
          cmp --silent cask-plan/candidate-cask.rb remote-cask.rb
          test "$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}" --jq .head.sha)" = "${EXPECTED_HEAD}"
          echo "head_sha=${EXPECTED_HEAD}" >> "${GITHUB_OUTPUT}"

  merge-cask-bump:
    name: Merge validated Homebrew cask bump
    needs: [prepare-cask-bump, write-cask-bump, validate-cask-bump]
    if: needs.prepare-cask-bump.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Wait for checks on the validated head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.write-cask-bump.outputs.pr_number }}
          HEAD_SHA: ${{ needs.validate-cask-bump.outputs.head_sha }}
        run: |
          test "$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}" --jq .head.sha)" = "${HEAD_SHA}"
          CHECK_TIMEOUT_SECONDS=1500
          CHECK_INTERVAL_SECONDS=10
          DEADLINE=$((SECONDS + CHECK_TIMEOUT_SECONDS))
          REQUIRED_CHECKS=0
          for attempt in {1..30}; do
            REQUIRED_CHECKS=$(gh pr checks "${PR_NUMBER}" \
              --repo starhaven-io/homebrew-tap --required --json name --jq length 2>/dev/null || true)
            if [[ "${REQUIRED_CHECKS}" =~ ^[1-9][0-9]*$ ]]; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              echo "::error::no required checks appeared before the cask check timeout"
              exit 1
            fi
            sleep "${CHECK_INTERVAL_SECONDS}"
          done
          CHECKS_READY=false
          MERGE_STATE=UNKNOWN
          while (( SECONDS < DEADLINE )); do
            CHECK_STATUS=0
            gh pr checks "${PR_NUMBER}" --repo starhaven-io/homebrew-tap --required \
              || CHECK_STATUS=$?
            case "${CHECK_STATUS}" in
              0) CHECK_SUMMARY=passing ;;
              8) CHECK_SUMMARY=pending ;;
              *)
                echo "::error::a required cask check failed"
                exit "${CHECK_STATUS}"
                ;;
            esac
            PR_STATE=$(gh pr view "${PR_NUMBER}" --repo starhaven-io/homebrew-tap \
              --json headRefOid,mergeStateStatus)
            if ! jq -e --arg head "${HEAD_SHA}" \
              '.headRefOid == $head' <<< "${PR_STATE}" >/dev/null; then
              echo "::error::cask pull request head changed while waiting for required checks"
              exit 1
            fi
            MERGE_STATE=$(jq -r '.mergeStateStatus' <<< "${PR_STATE}")
            echo "Required cask checks: ${CHECK_SUMMARY}; merge state: ${MERGE_STATE}"
            if (( CHECK_STATUS == 0 )) \
              && [[ "${MERGE_STATE}" == "CLEAN" || "${MERGE_STATE}" == "UNSTABLE" ]]; then
              CHECKS_READY=true
              break
            fi
            sleep "${CHECK_INTERVAL_SECONDS}"
          done
          if [[ "${CHECKS_READY}" != true ]]; then
            echo "::error::required cask checks did not satisfy branch policy before the timeout (merge state: ${MERGE_STATE})"
            exit 1
          fi

      - name: Mint bot token for tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Revalidate and merge the exact head
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          PR_NUMBER: ${{ needs.write-cask-bump.outputs.pr_number }}
          BOT_USER: ${{ needs.write-cask-bump.outputs.bot_user }}
          BRANCH: ${{ needs.write-cask-bump.outputs.branch }}
          BASE_BRANCH: ${{ needs.prepare-cask-bump.outputs.base_branch }}
          BASE_SHA: ${{ needs.prepare-cask-bump.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validate-cask-bump.outputs.head_sha }}
        run: |
          PR_JSON=$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}")
          jq -e \
            --arg bot "${BOT_USER}" \
            --arg branch "${BRANCH}" \
            --arg base "${BASE_BRANCH}" \
            --arg base_sha "${BASE_SHA}" \
            --arg head "${HEAD_SHA}" \
            '.state == "open"
              and .user.login == $bot
              and .head.ref == $branch
              and .head.repo.full_name == "starhaven-io/homebrew-tap"
              and .head.sha == $head
              and .base.ref == $base
              and .base.sha == $base_sha
              and .changed_files == 1' <<< "${PR_JSON}" >/dev/null
          test "$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}/files" \
            --jq 'if length == 1 and .[0].filename == "Casks/midden.rb" and .[0].status == "modified" then "valid" else "invalid" end')" = valid
          gh pr merge "${PR_NUMBER}" --repo starhaven-io/homebrew-tap --squash \
            --match-head-commit "${HEAD_SHA}"
